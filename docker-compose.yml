# Local PostgreSQL for development: `docker compose up -d`
# Matches DATABASE_URL="postgresql://solar:solar@localhost:5432/solarbom?schema=public"
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: solar
      POSTGRES_PASSWORD: solar
      POSTGRES_DB: solarbom
    ports:
      - "5432:5432"
    volumes:
      - solarbom-data:/var/lib/postgresql/data
volumes:
  solarbom-data:
